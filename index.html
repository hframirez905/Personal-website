<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hector Felipe Ramirez — Professional Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --adobe:#A6553B;
  --moss:#5C6B4F;
  --tan:#D8B98E;
  --parchment:#F4EEE1;
  --bark:#3E332B;
  --bark-soft:#6B5D50;
  --card:#FFFFFF;
  --line:#E4D9C8;
  --radius:16px;
  --max:1140px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--parchment);
  color:var(--bark);
  font-family:'Source Sans 3', sans-serif;
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-family:'Playfair Display', serif;
  font-weight:600;
  margin:0;
}
p{margin:0;}
a{color:inherit;}
.section{padding:100px 0;}
.section + .section{border-top:1px solid var(--line);}
.section-inner{max-width:var(--max);margin:0 auto;padding:0 32px;}
.eyebrow-label{
  display:inline-block;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--adobe);
  margin-bottom:14px;
}
.section h2{font-size:clamp(28px,4vw,40px);margin-bottom:8px;}
.section > .section-inner > p.hint{color:var(--bark-soft);font-size:15px;margin-top:8px;margin-bottom:48px;}

/* ---------- TOPBAR ---------- */
#topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(244,238,225,0.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:var(--max);margin:0 auto;padding:14px 32px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.brand{font-family:'Playfair Display',serif;font-weight:600;font-size:17px;white-space:nowrap;}
.nav-toggle{
  display:none;background:none;border:1px solid var(--line);border-radius:10px;
  font-size:20px;padding:6px 12px;cursor:pointer;color:var(--bark);
}
#mainNav{display:flex;}
.nav-links{list-style:none;display:flex;gap:26px;margin:0;padding:0;}
.nav-links a{
  text-decoration:none;font-size:14px;font-weight:600;color:var(--bark-soft);
  letter-spacing:0.02em;transition:color .2s ease;
}
.nav-links a:hover{color:var(--adobe);}
.topbar-actions{display:flex;align-items:center;gap:18px;}
.social-circle{
  width:34px;height:34px;border-radius:50%;
  background:var(--bark);color:var(--parchment);
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;flex-shrink:0;transition:background .2s ease;
}
.social-circle:hover{background:var(--adobe);}
.social-circle svg{width:16px;height:16px;fill:currentColor;}
.lang-switcher{display:flex;gap:10px;}
.lang-btn{
  background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:'Source Sans 3',sans-serif;
  opacity:0.55;transition:opacity .2s ease, transform .2s ease;
}
.lang-btn:hover{opacity:0.85;transform:translateY(-1px);}
.lang-btn.active{opacity:1;}
.lang-flag{
  width:28px;height:28px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.lang-btn.active .lang-flag{border-color:var(--adobe);box-shadow:0 0 0 2px rgba(166,85,59,0.18);}
.lang-code{font-size:10px;font-weight:700;letter-spacing:0.05em;color:var(--bark);}

/* ---------- HERO ---------- */
.hero{
  position:relative;overflow:hidden;
  background:var(--bark);color:var(--parchment);
  padding:150px 32px 130px;text-align:center;
}
.hero-bg{position:absolute;inset:0;overflow:hidden;z-index:0;}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.55;}
.b1{width:520px;height:520px;background:var(--adobe);top:-160px;left:-120px;animation:float1 22s ease-in-out infinite;}
.b2{width:460px;height:460px;background:var(--moss);bottom:-180px;right:-100px;animation:float2 26s ease-in-out infinite;}
.b3{width:380px;height:380px;background:var(--tan);top:30%;left:55%;animation:float3 19s ease-in-out infinite;opacity:0.35;}
@keyframes float1{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(60px,80px) scale(1.15);}
}
@keyframes float2{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(-70px,-50px) scale(1.1);}
}
@keyframes float3{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(-90px,60px) scale(1.2);}
}
.hero-content{position:relative;z-index:1;max-width:820px;margin:0 auto;}
.hero .eyebrow{
  font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--tan);margin-bottom:26px;display:block;
}
.hero h1{font-size:clamp(38px,7vw,66px);line-height:1.08;color:var(--parchment);}
.hero .subtitle{
  margin-top:18px;font-size:19px;color:var(--tan);
  font-family:'Playfair Display',serif;font-style:italic;font-weight:500;
}
.cv-btn{
  display:inline-block;margin-top:44px;
  background:var(--adobe);color:var(--parchment);
  padding:14px 34px;border-radius:999px;text-decoration:none;
  font-weight:600;font-size:15px;letter-spacing:0.02em;
  transition:background .2s ease, transform .2s ease;
  border:1px solid rgba(244,238,225,0.25);
}
.cv-btn:hover{background:#8f4630;transform:translateY(-2px);}

/* ---------- ABOUT ---------- */
.about-text{max-width:760px;display:flex;flex-direction:column;gap:20px;}
.about-text p{font-size:19px;line-height:1.7;}
.about-text p:first-child{font-size:21px;}

/* ---------- TIMELINE ---------- */
.timeline{position:relative;max-width:920px;margin:0 auto;}
.timeline::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;
  background:var(--line);transform:translateX(-50%);
}
.t-item{
  position:relative;width:50%;padding:0 44px 56px;
}
.t-item:nth-child(odd){left:0;text-align:right;}
.t-item:nth-child(even){left:50%;text-align:left;}
.t-dot{
  position:absolute;top:2px;width:16px;height:16px;border-radius:50%;
  background:var(--adobe);border:3px solid var(--parchment);
  box-shadow:0 0 0 2px var(--line);cursor:pointer;
  transition:transform .25s ease, background .25s ease;
}
.t-item:nth-child(odd) .t-dot{right:-8px;}
.t-item:nth-child(even) .t-dot{left:-8px;}
.t-item:hover .t-dot{transform:scale(1.35);background:var(--moss);}
.t-node{cursor:pointer;}
.t-year{font-weight:700;color:var(--adobe);font-size:14px;letter-spacing:0.04em;}
.t-title{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;margin-top:4px;}
.t-org{font-size:14px;color:var(--bark-soft);margin-top:3px;}

@media (max-width:760px){
  .timeline::before{left:14px;}
  .t-item, .t-item:nth-child(even){width:100%;left:0;text-align:left;padding:0 0 40px 44px;}
  .t-item:nth-child(odd) .t-dot,.t-item:nth-child(even) .t-dot{left:6px;right:auto;}
}

/* Timeline modal - Prezi/Apple zoom style */
.tm-overlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(62,51,43,0.55);
  align-items:center;justify-content:center;padding:24px;
}
.tm-overlay.open{display:flex;}
.tm-modal{
  background:var(--card);border-radius:20px;max-width:640px;width:100%;
  padding:42px;position:relative;max-height:86vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(62,51,43,0.35);
  transform:scale(0.55);opacity:0;transition:transform .32s cubic-bezier(.2,.8,.3,1.15), opacity .25s ease;
}
.tm-overlay.open .tm-modal{transform:scale(1);opacity:1;}
.modal-close{
  position:absolute;top:20px;right:20px;background:var(--parchment);border:none;
  width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--bark);
}
.modal-close:hover{background:var(--tan);}
.tm-year{color:var(--adobe);font-weight:700;font-size:14px;letter-spacing:0.05em;}
.tm-title{font-size:26px;margin-top:8px;padding-right:20px;}
.tm-org{color:var(--bark-soft);font-size:15px;margin-top:6px;font-style:italic;}
.tm-desc{margin-top:20px;font-size:16px;line-height:1.7;}
.tm-media{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:26px;}
.media-slot{
  aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:var(--bark-soft);
  font-size:22px;background:var(--parchment);
}
@media (max-width:560px){.tm-media{grid-template-columns:repeat(3,1fr);}}

/* ---------- PROJECTS ---------- */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;}
.project-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px;display:flex;flex-direction:column;gap:14px;
}
.status-tag{
  align-self:flex-start;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
  font-weight:700;color:var(--adobe);background:rgba(166,85,59,0.1);
  padding:5px 12px;border-radius:999px;
}
.project-card h3{font-size:18px;line-height:1.35;}
.project-card .p-desc{font-size:14.5px;color:var(--bark-soft);flex-grow:1;}
.project-links{display:flex;gap:16px;padding-top:14px;border-top:1px solid var(--line);}
.project-links button{
  background:none;border:none;padding:0;font-size:13px;font-weight:600;
  color:var(--moss);cursor:pointer;text-decoration:underline;text-underline-offset:3px;
}
.project-links button:hover{color:var(--adobe);}

/* generic modal (projects) */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:500;background:rgba(62,51,43,0.55);
  align-items:center;justify-content:center;padding:24px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--card);border-radius:20px;max-width:520px;width:100%;padding:38px;
  position:relative;box-shadow:0 30px 80px rgba(62,51,43,0.35);
}
.modal-kicker{font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--adobe);font-weight:700;margin-bottom:10px;}
.modal h3{font-size:22px;padding-right:24px;margin-bottom:14px;}
.modal p{color:var(--bark-soft);font-size:15px;}

/* ---------- PUBLICATIONS DECK ---------- */
.deck-wrap{position:relative;}
.deck{
  display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:10px 4px 26px;-webkit-overflow-scrolling:touch;
}
.deck::-webkit-scrollbar{height:6px;}
.deck::-webkit-scrollbar-thumb{background:var(--tan);border-radius:10px;}
.pub-card{
  scroll-snap-align:start;flex:0 0 300px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:28px;
  display:flex;flex-direction:column;gap:12px;
}
.pub-card h3{font-size:18px;line-height:1.35;}
.pub-sub{font-size:12.5px;font-weight:600;color:var(--moss);text-transform:uppercase;letter-spacing:0.03em;}
.pub-card p.pub-desc{font-size:14px;color:var(--bark-soft);}
.deck-controls{display:flex;gap:12px;justify-content:flex-end;margin-top:-8px;}
.deck-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  cursor:pointer;font-size:16px;color:var(--bark);
}
.deck-btn:hover{background:var(--tan);}

/* ---------- INTERESTS & LANGUAGES ---------- */
.interests-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;}
.interests-text{font-size:17px;line-height:1.7;margin-bottom:22px;}
.media-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.media-gallery .media-slot{aspect-ratio:4/3;font-size:26px;}
.media-hint{margin-top:10px;font-size:13px;color:var(--bark-soft);font-style:italic;}
.lang-title{font-size:20px;margin-bottom:20px;}
.lang-row{margin-bottom:16px;}
.lang-row-top{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:6px;}
.lang-row-top .lname{font-weight:600;}
.lang-row-top .llevel{color:var(--bark-soft);font-size:12.5px;}
.lang-bar-track{height:7px;background:var(--line);border-radius:99px;overflow:hidden;}
.lang-bar-fill{height:100%;background:var(--adobe);border-radius:99px;}
@media (max-width:800px){.interests-grid{grid-template-columns:1fr;}}

/* ---------- CONTACT / FOOTER ---------- */
footer{background:var(--bark);color:var(--parchment);padding:90px 0 46px;}
.contact-inner{max-width:640px;margin:0 auto;padding:0 32px;text-align:center;}
footer h2{color:var(--parchment);}
.contact-sub{color:var(--tan);margin-top:10px;margin-bottom:40px;font-size:15.5px;}
.contact-form{display:flex;flex-direction:column;gap:16px;text-align:left;}
.contact-form input,.contact-form textarea{
  width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(244,238,225,0.25);
  background:rgba(244,238,225,0.06);color:var(--parchment);font-family:'Source Sans 3',sans-serif;
  font-size:15px;
}
.contact-form input::placeholder,.contact-form textarea::placeholder{color:rgba(244,238,225,0.45);}
.contact-form textarea{min-height:120px;resize:vertical;}
.contact-form label{font-size:13px;color:var(--tan);margin-bottom:-8px;}
.submit-btn{
  align-self:flex-start;background:var(--adobe);color:var(--parchment);border:none;
  padding:14px 32px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;
  transition:background .2s ease;
}
.submit-btn:hover{background:#c06544;}
.form-note{font-size:13.5px;color:var(--tan);margin-top:14px;display:none;}
.form-note.show{display:block;}
.footer-fine{margin-top:60px;font-size:13px;color:rgba(244,238,225,0.55);text-align:center;}
.footer-email{color:var(--tan);text-decoration:none;font-weight:600;}

@media (max-width:900px){
  .nav-toggle{display:inline-block;}
  #mainNav{
    display:none;position:absolute;top:100%;left:0;right:0;background:var(--parchment);
    border-bottom:1px solid var(--line);padding:16px 32px;
  }
  #mainNav.open{display:block;}
  .nav-links{flex-direction:column;gap:16px;}
  .topbar-actions{gap:12px;}
}
</style>
</head>
<body>

<header id="topbar">
  <div class="topbar-inner">
    <div class="brand">Hector Felipe Ramirez</div>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    <nav id="mainNav">
      <ul class="nav-links" id="navLinks"></ul>
    </nav>
    <div class="topbar-actions">
      <a class="social-circle" href="https://www.linkedin.com/in/hector-ramirez-11182067/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M4.98 3.5C4.98 4.88 3.9 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8.5h4V23h-4V8.5zM8.5 8.5h3.83v1.98h.05c.53-1 1.84-2.06 3.79-2.06 4.06 0 4.81 2.67 4.81 6.14V23h-4v-6.7c0-1.6-.03-3.66-2.23-3.66-2.23 0-2.57 1.74-2.57 3.54V23h-4V8.5z"/></svg>

        <button class="lang-btn" data-lang="fr"><span class="lang-flag">🇫🇷</span><span class="lang-code">FR</span></button>

</header>

<section class="hero" id="hero">
  <div class="hero-bg" aria-hidden="true">

<section class="section" id="about">

<section class="section" id="projects">

<section class="section" id="interests">

<!-- Timeline zoom modal -->
<div class="tm-overlay" id="tmOverlay">
  <div class="tm-modal" id="tmModal">

    <div class="tm-year" id="tmYear"></div>

    <p class="tm-desc" id="tmDesc"></p>
    <div class="tm-media" id="tmMedia"></div>
  </div>
</div>

<!-- Project modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-kicker" id="modalKicker"></div>
    <h3 id="modalTitle"></h3>
    <p id="modalBody"></p>
  </div>

let currentLang = localStorage.getItem('site_lang') || 'en';

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function renderNav(t){
  const ul = document.getElementById('navLinks');
  ul.innerHTML = '';
  const items = [
    ['#background', t.nav.background],
    ['#about', t.nav.about],
    ['#projects', t.nav.projects],
    ['#pubs', t.nav.pubs],
    ['#interests', t.nav.interests],
    ['#contact', t.nav.contact]
  ];
  items.forEach(([href,label])=>{
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = href; a.textContent = label;
    a.addEventListener('click', ()=>{ document.getElementById('mainNav').classList.remove('open'); });
    li.appendChild(a);
    ul.appendChild(li);
  });
}

function renderHero(t){
  document.getElementById('heroEyebrow').textContent = t.hero.eyebrow;
  document.getElementById('heroName').textContent = t.hero.name;
  document.getElementById('heroSubtitle').textContent = t.hero.subtitle;
  document.getElementById('cvBtn').textContent = t.hero.cv;
}

function renderAbout(t){
  document.getElementById('aboutLabel').textContent = t.about.label;
  document.getElementById('aboutTitle').textContent = t.about.title;
  const wrap = document.getElementById('aboutText');
  wrap.innerHTML = '';
  t.about.text.forEach(p=>{
    const para = document.createElement('p');
    para.textContent = p;
    wrap.appendChild(para);
  });
}

let currentTimelineItems = [];
function renderBackground(t){
  document.getElementById('bgLabel').textContent = t.background.label;
  document.getElementById('bgTitle').textContent = t.background.title;
  document.getElementById('bgHint').textContent = t.background.hint;
  currentTimelineItems = t.background.items;
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  t.background.items.forEach((item, idx)=>{
    const wrap = document.createElement('div');
    wrap.className = 't-item';
    const dot = document.createElement('div');
    dot.className = 't-dot';
    const node = document.createElement('div');
    node.className = 't-node';
    node.innerHTML = `<div class="t-year">${item.year}</div><div class="t-title">${item.title}</div><div class="t-org">${item.org}</div>`;
    const open = ()=> openTimelineModal(idx);
    dot.addEventListener('mouseenter', open);
    node.addEventListener('mouseenter', open);
    dot.addEventListener('click', open);
    node.addEventListener('click', open);
    wrap.appendChild(dot);
    wrap.appendChild(node);
    tl.appendChild(wrap);
  });
}

function openTimelineModal(idx){
  const item = currentTimelineItems[idx];
  const t = CONTENT[currentLang];
  document.getElementById('tmYear').textContent = item.year;
  document.getElementById('tmTitle').textContent = item.title;
  document.getElementById('tmOrg').textContent = item.org;
  document.getElementById('tmDesc').textContent = item.desc;
  const media = document.getElementById('tmMedia');
  media.innerHTML = '';
  for(let i=0;i<5;i++){
    const slot = document.createElement('div');
    slot.className = 'media-slot';
    slot.textContent = '+';
    slot.title = t.modal.addPhoto;
    media.appendChild(slot);
  }
  document.getElementById('tmOverlay').classList.add('open');
}
function closeTimelineModal(){
  document.getElementById('tmOverlay').classList.remove('open');
}

function renderProjects(t){
  document.getElementById('projLabel').textContent = t.projects.label;
  document.getElementById('projTitle').textContent = t.projects.title;
  const grid = document.getElementById('projectsGrid');
  grid.innerHTML = '';
  t.projects.items.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <span class="status-tag">${t.projects.tag}</span>
      <h3>${p.title}</h3>
      <p class="p-desc">${p.desc}</p>
      <div class="project-links">
        <button type="button" data-kind="${t.projects.howBuilt}" data-title="${p.title}">${t.projects.howBuilt}</button>
        <button type="button" data-kind="${t.projects.docs}" data-title="${p.title}">${t.projects.docs}</button>
      </div>`;
    grid.appendChild(card);
  });
}

function renderPubs(t){
  document.getElementById('pubLabel').textContent = t.pubs.label;
  document.getElementById('pubTitle').textContent = t.pubs.title;
  const deck = document.getElementById('pubDeck');
  deck.innerHTML = '';
  t.pubs.items.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'pub-card';
    card.innerHTML = `<p class="pub-sub">${p.subtitle}</p><h3>${p.title}</h3><p class="pub-desc">${p.desc}</p>`;
    deck.appendChild(card);
  });
}

function renderInterests(t){
  document.getElementById('intLabel').textContent = t.interests.label;
  document.getElementById('intTitle').textContent = t.interests.title;
  document.getElementById('intText').textContent = t.interests.text;
  document.getElementById('intMediaHint').textContent = t.interests.mediaHint;
  const gallery = document.getElementById('intGallery');
  gallery.innerHTML = '';
  for(let i=0;i<4;i++){
    const slot = document.createElement('div');
    slot.className = 'media-slot';
    slot.textContent = '+';
    gallery.appendChild(slot);
  }
  document.getElementById('langTitle').textContent = t.interests.langTitle;
  const list = document.getElementById('langList');
  list.innerHTML = '';
  LANGUAGES.forEach(l=>{
    const row = document.createElement('div');
    row.className = 'lang-row';
    const levelLabel = l.native ? t.interests.native : (l.learning ? t.interests.learning : l.level);
    row.innerHTML = `
      <div class="lang-row-top"><span class="lname">${l.name}</span><span class="llevel">${levelLabel}</span></div>
      <div class="lang-bar-track"><div class="lang-bar-fill" style="width:${l.pct}%"></div></div>`;
    list.appendChild(row);
  });
}

function renderContact(t){
  document.getElementById('contactLabel').textContent = t.contact.label;
  document.getElementById('contactTitle').textContent = t.contact.title;
  document.getElementById('contactSub').textContent = t.contact.subtitle;
  document.getElementById('lblName').textContent = t.contact.name;
  document.getElementById('lblEmail').textContent = t.contact.email;
  document.getElementById('lblPhone').textContent = t.contact.phone;
  document.getElementById('lblMessage').textContent = t.contact.message;
  document.getElementById('sendBtn').textContent = t.contact.send;
  document.getElementById('formNote').textContent = t.contact.sentNote;
}

function renderLangSwitcher(){
  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });
}

function render(){
  const t = CONTENT[currentLang];
  document.documentElement.lang = currentLang;
  renderNav(t);
  renderHero(t);
  renderBackground(t);
  renderAbout(t);
  renderProjects(t);
  renderPubs(t);
  renderInterests(t);
  renderContact(t);
  renderLangSwitcher();
}

document.getElementById('langSwitcher').addEventListener('click', (e)=>{
  const btn = e.target.closest('.lang-btn');
  if(!btn) return;
  currentLang = btn.dataset.lang;
  localStorage.setItem('site_lang', currentLang);
  render();
});

document.getElementById('navToggle').addEventListener('click', ()=>{
  document.getElementById('mainNav').classList.toggle('open');
});

/* Timeline modal close handlers */
document.getElementById('tmClose').addEventListener('click', closeTimelineModal);
document.getElementById('tmOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'tmOverlay') closeTimelineModal();
});
document.getElementById('tmModal').addEventListener('mouseleave', ()=>{
  closeTimelineModal();
});

/* Project modal */
const modalOverlay = document.getElementById('modalOverlay');
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-kind]');
  if(btn){
    document.getElementById('modalKicker').textContent = btn.getAttribute('data-kind');
    document.getElementById('modalTitle').textContent = btn.getAttribute('data-title');
    document.getElementById('modalBody').textContent = CONTENT[currentLang].modal.comingSoon;
    modalOverlay.classList.add('open');
  }
});
document.getElementById('modalClose').addEventListener('click', ()=> modalOverlay.classList.remove('open'));
modalOverlay.addEventListener('click', (e)=>{ if(e.target === modalOverlay) modalOverlay.classList.remove('open'); });

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    modalOverlay.classList.remove('open');
    closeTimelineModal();
  }
});

/* Publications deck controls */
document.getElementById('deckPrev').addEventListener('click', ()=>{
  document.getElementById('pubDeck').scrollBy({left:-320, behavior:'smooth'});
});
document.getElementById('deckNext').addEventListener('click', ()=>{
  document.getElementById('pubDeck').scrollBy({left:320, behavior:'smooth'});
});

/* Contact form - visual only */
document.getElementById('contactForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const note = document.getElementById('formNote');
  note.classList.add('show');
  document.getElementById('contactForm').reset();
});

render();
