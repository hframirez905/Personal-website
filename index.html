<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hector Felipe Ramirez — Professional Site</title>
<meta name="description" content="Hector Felipe Ramirez — international development, human rights, and AI &amp; digital transformation practitioner.">
<link rel="canonical" href="https://hectorfeliperamirez.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="Hector Felipe Ramirez — Professional Site">
<meta property="og:description" content="International development, human rights, and AI &amp; digital transformation practitioner.">
<meta property="og:url" content="https://hectorfeliperamirez.com/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Hector Felipe Ramirez — Professional Site">
<meta name="twitter:description" content="International development, human rights, and AI &amp; digital transformation practitioner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Libre+Franklin:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --terracotta:#C1622D;
  --sienna:#8A4B2F;
  --sand:#E8DCC8;
  --ivory:#FAF6EE;
  --charcoal:#332B24;
  --charcoal-soft:#6B5D50;
  --olive:#6B7A4F;
  --card:#FFFFFF;
  --line:#E9DFCE;
  --radius:16px;
  --max:1140px;
  --font-display:'Oswald', sans-serif;
  --font-label:'Libre Franklin', sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--ivory);
  color:var(--charcoal);
  font-family:var(--font-display);
  font-weight:300;
  font-size:17px;
  line-height:26px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-family:var(--font-display);
  font-weight:700;
  margin:0;
}
/* smaller headings (card/modal titles) get lighter tracking than section headlines */
h3{letter-spacing:0.02em;font-weight:600;}
p{margin:0;}
a{color:inherit;}
.section{padding:100px 0;}
.section + .section{border-top:1px solid var(--line);}
.section.band-sand{background:var(--sand);}
.section-inner{max-width:var(--max);margin:0 auto;padding:0 32px;}
.eyebrow-label{
  display:inline-block;
  font-family:var(--font-label);
  font-size:12px;
  font-weight:300;
  letter-spacing:0.03em;
  text-transform:uppercase;
  color:var(--terracotta);
  margin-bottom:14px;
}
.section h2{
  font-size:clamp(28px,4vw,40px);
  text-transform:uppercase;
  letter-spacing:0.1em;
  margin-bottom:8px;
  padding-bottom:20px;
  position:relative;
}
.section h2::after, footer h2::after{
  content:"";position:absolute;left:0;bottom:0;
  width:50px;height:3px;background:var(--terracotta);
}
footer h2{position:relative;padding-bottom:20px;text-transform:uppercase;letter-spacing:0.1em;}
.section > .section-inner > p.hint{color:var(--charcoal-soft);font-family:var(--font-label);font-size:14px;letter-spacing:0.02em;margin-top:8px;margin-bottom:48px;}

/* Ghost-numeral step component (used in How-I-Built-This popups) */
.ghost-steps{display:flex;flex-direction:column;gap:6px;margin-top:20px;}
.ghost-step{position:relative;padding:22px 20px 22px 8px;overflow:hidden;border-bottom:1px solid var(--line);}
.ghost-step:last-child{border-bottom:none;}
.ghost-step .ghost-num{
  position:absolute;top:-18px;right:4px;
  font-family:var(--font-display);font-weight:700;
  font-size:90px;line-height:1;
  color:var(--terracotta);opacity:0.08;
  z-index:0;pointer-events:none;
}
.ghost-step .step-content{position:relative;z-index:1;max-width:80%;}
.ghost-step .step-content p{font-size:16px;line-height:1.6;}

/* ---------- TOPBAR ---------- */
#topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(250,246,238,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:var(--max);margin:0 auto;padding:14px 32px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;font-size:16px;white-space:nowrap;}
.nav-toggle{
  display:none;background:none;border:1px solid var(--line);border-radius:10px;
  font-size:20px;padding:6px 12px;cursor:pointer;color:var(--charcoal);
}
#mainNav{display:flex;min-width:0;}
.nav-links{list-style:none;display:flex;gap:16px;margin:0;padding:0;flex-wrap:nowrap;white-space:nowrap;}
.nav-links a{
  font-family:var(--font-label);
  text-decoration:none;font-size:11px;font-weight:600;color:var(--charcoal-soft);
  letter-spacing:0.02em;text-transform:uppercase;transition:color .2s ease;
}
.nav-links a:hover{color:var(--terracotta);}
.topbar-actions{display:flex;align-items:center;gap:18px;}
.social-circle{
  width:34px;height:34px;border-radius:50%;
  background:var(--charcoal);color:var(--ivory);
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;flex-shrink:0;transition:background .2s ease;
}
.social-circle:hover{background:var(--terracotta);}
.social-circle svg{width:16px;height:16px;fill:currentColor;}
.lang-switcher-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.lang-switcher{display:flex;gap:10px;}
.lang-btn{
  width:44px;height:44px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:0.02em;
  color:var(--charcoal-soft);
  opacity:0.7;transition:opacity .2s ease, transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.lang-btn:hover{opacity:1;transform:translateY(-1px);}
.lang-btn.active{
  opacity:1;color:var(--terracotta);
  border-color:var(--terracotta);box-shadow:0 0 0 2px rgba(193,98,45,0.18);
}
.lang-switcher-label{
  font-family:var(--font-label);font-size:9.5px;font-weight:600;
  letter-spacing:0.08em;text-transform:uppercase;color:var(--charcoal-soft);
}

/* ---------- PAC-MAN PROGRESS BAR ---------- */
.pac-wrap{border-top:1px solid var(--line);background:var(--ivory);}
.pacman-track{
  position:relative;height:26px;max-width:var(--max);margin:0 auto;
  padding:0 32px;display:flex;align-items:center;
}
.pac-dot{
  width:10px;height:10px;border-radius:50%;
  background-image:url('Website photos/pacman-dot.png');background-size:contain;background-repeat:no-repeat;background-position:center;
  flex:0 0 10px;margin:0 5px;transition:opacity .15s ease, transform .15s ease;
}
.pac-dot.eaten{opacity:0;transform:scale(0);}
.pacman{
  position:absolute;top:50%;width:26px;height:26px;border-radius:50%;
  transform:translate(-50%,-50%);left:0;
  background-image:url('Website photos/pacman-icon.png');
  background-size:contain;background-repeat:no-repeat;background-position:center;
  animation:chomp .45s steps(1,end) infinite;
}
.pacman::after{
  content:"";position:absolute;top:14.5%;left:54.5%;width:13.5%;height:13.5%;
  border-radius:50%;background:#241f1a;
}
@keyframes chomp{
  0%,49%{background-image:url('Website photos/pacman-icon.png');}
  50%,100%{background-image:radial-gradient(circle at 35% 28%, #FDE98A 0%, #F6D22B 55%, #D9AE1B 100%);}
}

/* ---------- HERO ---------- */
.hero{
  position:relative;overflow:hidden;
  background:var(--charcoal);color:var(--ivory);
  padding:150px 32px 120px;text-align:center;
}
.hero-bg{position:absolute;inset:0;overflow:hidden;z-index:0;}
.hero-bg img,.hero-bg video{width:100%;height:100%;object-fit:cover;display:block;}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background:var(--charcoal);opacity:0.55;
}
.hero-content{position:relative;z-index:1;max-width:820px;margin:0 auto;}
.hero .eyebrow{
  font-family:var(--font-label);
  font-size:12px;font-weight:300;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--sand);margin-bottom:26px;display:block;
}
.hero h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(38px,7vw,66px);line-height:1.08;letter-spacing:0.08em;
  color:var(--ivory);
}
.hero .subtitle{
  margin-top:20px;font-family:var(--font-label);font-weight:300;
  font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--sand);
}
.cv-buttons{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:44px;}
.cv-label{font-family:var(--font-label);color:var(--sand);font-weight:600;font-size:13px;letter-spacing:0.02em;}
.cv-btn{
  display:inline-block;background:var(--terracotta);color:var(--ivory);
  padding:10px 24px;border-radius:999px;text-decoration:none;
  font-family:var(--font-label);font-weight:600;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;
  transition:background .2s ease, transform .2s ease;
  border:1px solid rgba(250,246,238,0.25);
}
.cv-btn:hover{background:var(--sienna);transform:translateY(-2px);}

/* ---------- ABOUT (overlapping module break over the hero) ---------- */
#about{padding-top:0;border-top:none;}
.about-card{
  background:var(--card);border-radius:20px;
  box-shadow:0 24px 60px rgba(51,43,36,0.18);
  padding:56px 48px;margin-top:-90px;position:relative;z-index:2;
}
@media (max-width:640px){.about-card{padding:36px 26px;margin-top:-50px;}}
.about-layout{display:grid;grid-template-columns:280px 1fr;gap:44px;align-items:start;}
.about-portrait{
  width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;
  box-shadow:0 14px 34px rgba(51,43,36,0.2);
}
.about-portrait img{width:100%;height:100%;object-fit:cover;display:block;}
.about-text{max-width:760px;display:flex;flex-direction:column;gap:20px;}
.about-text p{font-size:15px;line-height:1.6;}
.about-text p:first-child{font-size:16px;}
@media (max-width:760px){
  .about-layout{grid-template-columns:1fr;}
  .about-portrait{max-width:220px;margin:0 auto;}
}

/* ---------- SKILLS ---------- */
.skill-category{margin-bottom:38px;}
.skill-cat-title{font-size:18px;margin-bottom:18px;color:var(--charcoal);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;font-family:var(--font-display);}
.skill-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 20px;}
.skill-tool{display:flex;align-items:center;gap:12px;}
.tool-circle{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:12px;letter-spacing:0.01em;
  font-family:var(--font-label);
}
.tool-name{font-size:14.5px;color:var(--charcoal);}
.license-block{margin-top:12px;margin-bottom:56px;padding-top:32px;border-top:1px solid var(--line);}
.license-block h3{font-size:16px;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.04em;font-family:var(--font-display);}
.license-badges{display:flex;gap:10px;}
.badge{
  background:var(--sand);color:var(--charcoal);font-weight:700;font-size:13px;
  font-family:var(--font-label);letter-spacing:0.02em;
  padding:8px 18px;border-radius:999px;
}
.interests-subsection{padding-top:8px;}
.interests-subsection h3.sub-title{font-size:22px;margin-bottom:28px;text-transform:uppercase;letter-spacing:0.06em;font-family:var(--font-display);}
.interests-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;}
.interests-text{font-size:17px;line-height:1.7;margin-bottom:22px;}
.media-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.media-gallery .media-slot{aspect-ratio:4/3;font-size:26px;overflow:hidden;}
.media-slot img{width:100%;height:100%;object-fit:cover;display:block;}
.media-hint{margin-top:10px;font-size:13px;color:var(--charcoal-soft);font-style:italic;}
.lang-title{font-size:20px;margin-bottom:20px;}
.lang-row{margin-bottom:16px;}
.lang-row-top{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:6px;}
.lang-row-top .lname{font-weight:600;}
.lang-row-top .llevel{color:var(--charcoal-soft);font-size:12.5px;}
.lang-bar-track{height:7px;background:var(--line);border-radius:99px;overflow:hidden;}
.lang-bar-fill{height:100%;background:var(--terracotta);border-radius:99px;}
@media (max-width:800px){.interests-grid{grid-template-columns:1fr;}}

/* ---------- TIMELINE ---------- */
.timeline{position:relative;max-width:920px;margin:0 auto;}
.timeline::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;
  background:rgba(138,75,47,0.4);transform:translateX(-50%);
}
.t-item{position:relative;width:50%;padding:0 44px 56px;}
.t-item:nth-child(odd){left:0;text-align:right;}
.t-item:nth-child(even){left:50%;text-align:left;}
.t-dot{
  position:absolute;top:2px;width:16px;height:16px;border-radius:50%;
  background:var(--terracotta);border:3px solid var(--ivory);
  box-shadow:0 0 0 2px var(--line);cursor:pointer;
  transition:transform .25s ease, background .25s ease;
}
.t-item:nth-child(odd) .t-dot{right:-8px;}
.t-item:nth-child(even) .t-dot{left:-8px;}
.t-item:hover .t-dot{transform:scale(1.35);background:var(--olive);}
.t-node{cursor:pointer;}
.t-year{font-family:var(--font-label);font-weight:600;color:var(--terracotta);font-size:12.5px;letter-spacing:0.04em;text-transform:uppercase;}
.t-title{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:0.02em;margin-top:4px;}
.t-org{font-size:14px;color:var(--charcoal-soft);margin-top:3px;}

@media (max-width:760px){
  .timeline::before{left:14px;}
  .t-item, .t-item:nth-child(even){width:100%;left:0;text-align:left;padding:0 0 40px 44px;}
  .t-item:nth-child(odd) .t-dot,.t-item:nth-child(even) .t-dot{left:6px;right:auto;}
}

/* Timeline modal - Prezi/Apple zoom style */
.tm-overlay{
  display:none;position:fixed;inset:0;z-index:500;pointer-events:none;
  background:rgba(51,43,36,0.55);
  align-items:center;justify-content:center;padding:24px;
}
.tm-overlay.open{display:flex;}
.tm-modal{
  background:var(--card);border-radius:20px;max-width:640px;width:100%;
  padding:42px;position:relative;max-height:86vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(51,43,36,0.35);pointer-events:auto;
  transform:scale(0.55);opacity:0;transition:transform .32s cubic-bezier(.2,.8,.3,1.15), opacity .25s ease;
}
.tm-overlay.open .tm-modal{transform:scale(1);opacity:1;}
.modal-close{
  position:absolute;top:20px;right:20px;background:var(--ivory);border:none;
  width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--charcoal);
}
.modal-close:hover{background:var(--sand);}
.tm-year{font-family:var(--font-label);color:var(--terracotta);font-weight:600;font-size:13px;letter-spacing:0.05em;text-transform:uppercase;}
.tm-title{font-size:26px;letter-spacing:0.03em;margin-top:8px;padding-right:20px;}
.tm-org{font-family:var(--font-label);color:var(--charcoal-soft);font-size:13.5px;letter-spacing:0.02em;margin-top:6px;}
.tm-desc{margin-top:20px;font-size:16px;line-height:1.7;}
.tm-desc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px;}
.tm-desc li{line-height:1.65;}
.tm-media{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:26px;}
.tm-media:empty{display:none;margin-top:0;}
.media-slot{
  aspect-ratio:1/1;border-radius:10px;overflow:hidden;
  position:relative;cursor:pointer;
}
.media-slot img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:box-shadow .2s ease;
}
.media-slot:hover img{box-shadow:0 0 0 2px var(--terracotta) inset;}
@media (max-width:560px){.tm-media{grid-template-columns:repeat(3,1fr);}}

/* Fixed lightbox-style preview shown on photo hover (works from any scrollable container) */
.photo-zoom-preview{
  position:fixed;z-index:900;pointer-events:none;line-height:0;
  max-width:min(60vw,460px);max-height:min(60vh,460px);
  top:50%;left:50%;transform:translate(-50%,-50%) scale(0.85);
  border-radius:16px;overflow:hidden;
  box-shadow:0 30px 90px rgba(51,43,36,0.55);
  opacity:0;transition:opacity .2s ease, transform .2s ease;
}
.photo-zoom-preview.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.photo-zoom-preview img{
  display:block;width:auto;height:auto;
  max-width:min(60vw,460px);max-height:min(60vh,460px);
}

/* ---------- PROJECTS ---------- */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;}
.project-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px;display:flex;flex-direction:column;gap:14px;
  transition:background-color .25s ease;
}
.project-card:hover{background:var(--terracotta);}
.status-tag{
  align-self:flex-start;font-family:var(--font-label);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
  font-weight:600;color:var(--terracotta);background:rgba(193,98,45,0.1);
  padding:5px 12px;border-radius:999px;
  transition:color .25s ease, background-color .25s ease;
}
.project-card:hover .status-tag{color:var(--olive);background:var(--ivory);}
.project-card h3{font-size:19px;line-height:1.3;letter-spacing:0.02em;transition:color .25s ease;}
.project-card:hover h3{color:var(--olive);}
.project-card .p-desc{font-family:var(--font-label);font-size:13.5px;letter-spacing:0.01em;color:var(--charcoal-soft);flex-grow:1;transition:color .25s ease;}
.project-card:hover .p-desc{color:var(--olive);}
.project-links{display:flex;gap:16px;padding-top:14px;border-top:1px solid var(--line);}
.project-card:hover .project-links{border-top-color:var(--olive);}
.project-links button{
  background:none;border:none;padding:0;font-family:var(--font-label);font-size:12.5px;font-weight:600;
  letter-spacing:0.02em;text-transform:uppercase;
  color:var(--olive);cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  transition:color .25s ease;
}
.project-links button:hover{color:var(--terracotta);}
.project-card:hover .project-links button{color:var(--olive);}
.project-card:hover .project-links button:hover{color:var(--ivory);}

/* generic modal (projects) */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:500;background:rgba(51,43,36,0.55);
  align-items:center;justify-content:center;padding:24px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--card);border-radius:20px;max-width:520px;width:100%;padding:38px;
  position:relative;box-shadow:0 30px 80px rgba(51,43,36,0.35);
  max-height:86vh;overflow-y:auto;
  transition:max-width .2s ease;
}
.modal.modal-lg{max-width:760px;}
.modal-kicker{font-family:var(--font-label);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--terracotta);font-weight:600;margin-bottom:10px;}
.modal h3{font-size:24px;letter-spacing:0.03em;padding-right:24px;margin-bottom:14px;}
.modal p{font-family:var(--font-label);color:var(--charcoal-soft);font-size:14.5px;letter-spacing:0.01em;line-height:1.6;}

/* ---------- Documentation popup: skill-doc styling (uses the design system itself) ---------- */
.doc-section{margin-top:30px;}
.doc-section:first-of-type{margin-top:24px;}
.doc-section h4{
  font-family:var(--font-label);font-size:12px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.08em;color:var(--olive);margin-bottom:16px;
}
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
.swatch{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.swatch-color{height:56px;}
.swatch-info{padding:10px 12px;background:var(--ivory);}
.swatch-name{font-family:var(--font-display);font-weight:600;font-size:13.5px;letter-spacing:0.02em;}
.swatch-role{font-family:var(--font-label);font-size:10.5px;color:var(--charcoal-soft);letter-spacing:0.02em;margin-top:2px;}
.swatch-hex{font-family:var(--font-label);font-size:10.5px;color:var(--charcoal-soft);letter-spacing:0.03em;margin-top:2px;}
.type-sample{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;}
.type-sample .ts-label{font-family:var(--font-label);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--olive);margin-bottom:8px;}
.type-sample .ts-spec{font-family:var(--font-label);font-size:11px;color:var(--charcoal-soft);letter-spacing:0.02em;margin-top:6px;}
.ts-sample-headline{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:0.1em;text-transform:uppercase;}
.ts-sample-body{font-family:var(--font-display);font-weight:300;font-size:15px;line-height:1.5;}

tions Development Programme (UNDP) | Bogotá, Colombia", "photos": ["PNUD Grupo Tumaco.JPEG", "PNUD Tumaco Facilitacion.JPEG", "HFR PNUD Facilitacion 1.JPEG", "HFR PNUD.JPG", "HFR PNUD 1.JPG"], "bullets": ["Designed and formulated a restorative justice project in Tumaco for women and members of the LGBTIQ+ community survivors of sexual and gender-based violence, developing a full theory of change, logical framework, and a comprehensive monitoring and evaluation system.", "Led the evaluation of 4 restorative justice projects in Colombia, producing strategic recommendations for sustainability and institutional strengthening. Led the consultancy team operations (technical, administrative, and logistics), ensuring on-time delivery of all outputs.", "Facilitated a co-creation process with 13 civil society organizations and ethnic authorities, systematizing findings into actionable lessons learned, best practices, and donor reports."]}, {"id": "sabbatical", "year": "12/2023 – 01/2025", "title": "Sabbatical Year", "org": "Southeast Asia, China, Europe, Colombia, and Central Asia", "photos": ["HFR Angkor Wat.JPEG", "HFR Chinese Wall.jpg", "HFR Samarkand.JPEG", "HFR Tajik Mountains.JPEG", "HFR Durmitor Hike.JPEG"], "desc": "Took a year to travel slowly — Southeast Asia, China, Europe, Colombia and Central Asia — and let curiosity, not a job title, set the itinerary."}, {"id": "unfpa", "year": "06/2021 – 12/2023", "title": "P2 Programme Analyst (SIDA-funded JPO)", "org": "United Nations Population Fund (UNFPA) | Sarajevo, Bosnia and Herzegovina", "photos": ["Bodyright.JPEG", "HFR Bodyright Panel.JPEG", "HFR UNFPA Western Balkans.JPEG", "UN BiH Team.jpg", "HFR UNFPA Special Olympics.JPG"], "bullets": ["Co-managed a USD 1.5 Million regional project on youth participation and hate speech with UNDP, UNESCO, and UN Women across 5 Balkan countries achieving 100% donor compliance. Designed & implemented 28+ activities within the youth and peacebuilding portfolios creating monitoring  Sweden", "desc": "Moved to Sweden as an elected student representative and scholarship holder, researching community-driven development through a case study on Timor-Leste."}, {"id": "propaz", "year": "01/2017 – 08/2018", "title": "Lead Advisor in Transitional Justice and Missing Persons", "org": "Peacebuilding Program – ProPaz, GIZ | Bogotá, Colombia", "bullets": ["Forged strategic partnerships with the Attorney General's Office, Special Jurisdiction for Peace, and Search Unit for Missing Persons to advance justice processes under the 2016 Peace Agreement with the accompaniment and funding of the European Union (EU).", "Managed grants and subsidies with Civil Society Organizations (e.g., Colombian Commission of Jurists, Humanas NGO), improving victims' participation and women's access to justice. Carried out monitoring and evaluation activities taking into consideration migration and border dynamics.", "Produced comprehensive reports on human rights violations for transitional justice institutions, informing advocacy and policy reforms, systematized knowledge, managed learning and communications.", "Directed operational and financial planning for the transitional justice component; monitored implementers and consultants, ensuring accountability and evaluation of projects and consultancies."]}, {"id": "arn", "year": "02/2016 – 12/2016", "title": "Head of Aguachica's Office", "org": "Colombian Agency for Reincorporation and Normalization | Aguachica, Cesar, Colombia", "bullets": ["Directed a team of 15 staff across 14 municipalities, implementing the national reintegration policy for ex-combatants, carrying out its analysis, monitoring and evaluation at the regional level.", "Secured COP $2.3 Billion (~USD 600k) in municipal funding for reintegration initiatives sustainability. Systematized 15 best practices into knowledge products for national policy adoption.", "Designed & implemented an innovative political reintegration pilot (dialogue platform for ex-combatants, victims, and social leaders fostering reconciliation), awarded funding by the Ministry of Interior.", "Generated partnerships with the private sector for income generation, created communication strategies, and represented the institution in the media."], "photos": ["ACR Team.jpg", "HFR ACR 1.jpg", "HFR ACR 3.jpg", "HFR ACR Radio interview.jpg", "HFR ACR Radio interview (2).jpg"]}, {"id": "oas", "year": "05/2015 – 12/2015", "title": "National Support Practitioner", "org": "Organization of American States – Mission to Support the Peace Process (MAPP-OAS) | Valledupar, Colombia", "bullets": ["Monitored and analyzed conflict dynamics in 3 departments (Guajira, Magdalena, and Cesar), producing reports and policy recommendations for senior government and military officials on security, displacement, Disarmament, Demobilization & Reintegration (DDR), and peacebuilding.", "Collected and triangulated qualitative and quantitative conflict data to guide national peacebuilding strategies. Supported the monitoring of humanitarian assistance, disaster risk response, migration, and border dynamics with Venezuela."], "photos": ["HFR Mapp OEA.jpg", "HFR Mapp OEA 1.jpg", "HFR Mapp OEA 2.jpg", "HFR Mapp OEA 3.jpg"]}, {"id": "profis-ombudsman", "year": "04/2014 – 04/2015", "title": "Advisor to the Ombudsman", "org": "Transitional Justice Support Project – ProFis, GIZ | Barranquilla, Colombia", "bullets": ["Designed and delivered strategic litigation training for judicial representatives on human rights, gender-based violence (GBV), and intercultural dialogue with ethnic and indigenous peoples to strengthen reparations in high-profile transitional justice cases.", "Established an inter-institutional coordination mechanism for the Justice and Peace Law, chosen by 6+ national institutions and international actors as technical secretariat. Compiled lessons learned, conducted learning activities, and systematized knowledge on reparations in a chapter of a book I published."], "photos": [ selected for a Junior Professional Officer post with UNFPA, funded by the Swedish International Development Cooperation Agency."}, {"title": "Elected Student Representative & Scholarship Holder", "subtitle": "Lund University, 2018–2020", "desc": "Elected by peers to represent the student body while holding a merit-based scholarship throughout the Master's program."}]}}, "es": {"langLabel": "ESP", "nav": {"about": "Sobre mí", "background": "Trayectoria", "training": "Formación", "projects": "Proyectos", "pubs": "Publicaciones y Reconocimientos", "contact": "Contacto", "language": "Idioma"}, "hero": {"eyebrow": "Desarrollo Internacional × Derechos Humanos × IA y Transformación Digital", "name": "Hector Felipe Ramirez", "subtitle": "Sitio profesional", "cvLabel": "Descargar CV"}, "about": {"label": "Sobre mí", "title": "Un poco sobre mí", "text": ["¡Hola! 👋 Soy Hector — llevo más de 9 años trabajando en desarrollo internacional, sobre todo en gestión de proyectos y programas, derechos humanos, género, construcción de paz, juventud, y monitoreo y evaluación. Habiendo nacido en una sociedad violenta, lo que despertó mi interés en este campo fue entender cómo las sociedades enfrentan el conflicto y contribuir a encontrar caminos de regreso.", "Ese trabajo me ha llevado a Colombia, Bosnia y Herzegovina, y Timor Oriental, y también he vivido en el extranjero por estudios, en Estados Unidos y Suecia. SIDA financió mi despliegue diplomático con el Fondo de Población de las Naciones Unidas - UNFPA en Bosnia, y a lo largo de los años he trabajado sobre todo junto a organizaciones como la Agencia Alemana de Cooperación Internacional - GIZ, el Programa de las Naciones Unidas para el Desarrollo - PNUD, y la Organización de los Estados Americanos - OEA. Tengo una maestría de la Universidad de Lund, dos posgrados adicionales, y un pregrado en Ciencia Política.", "Ahora, en lugar de mirar hacia el pasado violento y sus consecuencias en el presente, he decidido mirar hacia el futuro y adentrarme en la transformación digital. Motivado por un profundo interés en la inteligencia artificial, estoy abrazando esta era como un cambio revolucionario para continuar la lucha por los derechos humanos, la igualdad y la justicia social a nivel global.", "Fuera del trabajo, soy malabarista profesional con debilidad por el circo y las artes escénicas. Viajar me hace sentir libre, escuchar y descubrir música nueva marca mi estado de ánimo, cocinar despeja mi mente, bailar siempre me da alegría, los deportes extremos desafían mis miedos, hacer ejercicio me hace sentir vivo, y las manualidades alimentan mi curiosidad.", "Trato de ser consciente del género, inclusivo, y respetuoso con el medio ambiente — siempre estoy dispuesto a salir a la naturaleza, descubrir mundos nuevos, conocer gente nueva, o quedar sorprendido por una conversación que termine en cualquier lado.", "¡Escríbeme sin pena! Hablemos de desarrollo internacional, trucos de inteligencia artificial, o simplemente intercambiemos ideas sobre viajes, música, o los mejores lugares para salir donde sea que estés."]}, "skills": {"label": "Habilidades", "title": "Habilidades y Herramientas", "licenseLabel": "Licencia de Conducción", "interests": {"title": "Intereses e Idiomas", "text": "Soy malabarista profesional con verdadero amor por las artes escénicas — la música, el baile, mantenerme activo y las conversaciones que se van por caminos interesantes son lo que me recarga entre proyecto y proyecto.", "mediaHint": "Algunas fotos del camino recorrido", "langTitle": "Idiomas", "native": "Nativo", "learning": "Actualmente aprendiendo"}, "categories": [{"name": "Datos y Monitoreo y Evaluación", "tools": [{"name": "NVivo", "mono": "Nv", "color": "#A6303A"}, {"name": "SPSS", "mono": "SP", "color": "#2E4057"}, {"name": "AppSheet", "mono": "Ap", "color": "#34A853"}, {"name": "Results-Based Management", "mono": "RBM", "color": "#4A6FA5"}, {"name": "Logical Framework", "mono": "LF", "color": "#C98B2E"}, {"name": "Surveys", "mono": "Sv", "color": "#2F7A6B"}]}, {"name": "Diseño y Comunicaciones", "tools": [{"name": "Canva", "mono": "Cv", "color": "#6C5CE7"}, {"name": "Prezi", "mono": "Pz", "color": "#1A73C1"}, {"name": "CapCut", "mono": "Cc", "color": "#0FC2C0"}]}, {"name": "Gestión de Programas y Proyectos", "tools": [{"name": "Monday.com", "mono": "Mo", "color": "#FF3D57"}, {"name": "Asana", "mono": "As", "color": "#F06A6A"}]}, {"name": "Inteligencia Artificial", "tools": [{"name": "ChatGPT", "mono": "Gp", "color": "#10A37F"}, {"name": "Claude", "mono": "Cl", "color": "#D97757"}, {"name": "DeepSeek", "mono": "Ds", "color": "#3B5BFF"}, {"name": "Gemini", "mono": "Ge", "color": "#4285F4"}, {"name": "Copilot", "mono": "Co", "color": "#0078D4"}, {"name": "Zapier", "mono": "Za", "color": "#FF4A00"}, {"name": "Airtable", "mono": "At", "color": "#FCB400"}, {"name": "NotebookLM", "mono": "Nl", "color": "#8E44AD"}, {"name": "Lumo", "mono": "Lu", "color": "#6D4AFF"}]}, {"name": "Productividad Diaria", "tools": [{"name": "Google Suite", "mono": "Gs", "color": "#4285F4"}, {"name": "Microsoft Office", "mono": "Of", "color": "#D83B01"}, {"name": "Microsoft Teams", "mono": "Te", "color": "#464EB8"}, {"name": "Slack", "mono": "Sl", "color": "#611F69"}, {"name": "Outlook", "mono": "Ol", "color": "#0072C6"}, {"name": "Zoom", "mono": "Zm", "color": "#2D8CFF"}, {"name": "Adobe", "mono": "Ad", "color": "#DA1F26"}, {"name": "GitHub", "mono": "Gh", "color": "#171515"}]}]}, "background": {"label": "Trayectoria", "title": "Una vida, brevemente trazada", "hint": "Pasa el cursor o toca un hito para ampliarlo — aléjate para cerrarlo", "items": [{"id": "dt", "year": "02/2026 – Presente", "title": "Consultor de Transformación Digital", "org": "Renta Espacio | Bogotá, Colombia", "bullets": ["Lidero la optimización de soluciones no-code, la automatización de flujos de trabajo operativos y comerciales, y la gestión de plataformas internas, herramientas de CRM y aplicaciones de reportería.", "Implemento soluciones prácticas de inteligencia artificial (IA), incluyendo asistentes con IA, ingeniería de mensajería instantánea para ventas y servicio al cliente, sistemas de respuesta automatizada, calificación de leads, reportes ejecutivos, mejoras de bots, generación de contenido con IA y control de calidad.", "Integro múltiples ecosistemas digitales, incluyendo Google Workspace, AppSheet, DataCRM, la API de WhatsApp Business y bases de datos internas, mientras desarrollo protocolos de usuario, materiales de capacitación y sesiones de fortalecimiento de capacidades para impulsar la adopción digital y la eficiencia operativa en todos los equipos."]}, {"id": "undp", "year": "02/2025 – 06/2025", "title": "Consultor Experto en Justicia Transicional y Diseño de Proyectos", "org": "Programa de las Naciones Unidas para el Desarrollo (PNUD) | Bogotá, Colombia", "photos": ["PNUD Grupo Tumaco.JPEG", "PNUD Tumaco Facilitacion.JPEG", "HFR PNUD Facilitacion 1.JPEG", "HFR PNUD.JPG", "HFR PNUD 1.JPG"], "bullets": ["Diseñé y formulé un proyecto de justicia restaurativa en Tumaco para mujeres y personas LGBTIQ+ sobrevivientes de violencia sexual y de género, desarrollando una teoría del cambio completa, un marco lógico y un sistema integral de monitoreo y evaluación.", "Lideré la evaluación de 4 proyectos de justicia restaurativa en Colombia, generando recomendaciones estratégicas para su sostenibilidad y fortalecimiento institucional. Dirigí las operaciones del equipo consultor (técnicas, administrativas y logísticas), garantizando la entrega oportuna de todos los productos.", "Facilité un proceso de co-creación con 13 organizaciones de la sociedad civil y autoridades étnicas, sistematizando hallazgos en lecciones aprendidas accionables, buenas prácticas e informes para donantes."]}, {"id": "sabbatical", "year": "12/2023 – 01/2025", "title": "Año sabático", "org": "Sudeste Asiático, China, Europa, Colombia y Asia Central", "photos": ["HFR Angkor Wat.JPEG", "HFR Chinese Wall.jpg", "HFR Samarkand.JPEG", "HFR Tajik Mountains.JPEG", "HFR Durmitor Hike.JPEG"], "desc": "Me tomé un año para viajar despacio — el Sudeste Asiático, China, Europa, Colombia y Asia Central — dejando que la curiosidad, y no un cargo, marcara el itinerario."}, {"id": "unfpa", "year": "06/2021 – 12/2023", "title": "Analista de Programa P2 (JPO financiado por SIDA)", "org": "Fondo de Población de las Naciones Unidas (UNFPA) | Sarajevo, Bosnia y Herzegovina", "photos": ["Bodyright.JPEG", "HFR Bodyright Panel.JPEG", "HFR UNFPA Western Balkans.JPEG", "UN BiH Team.jpg", "HFR UNFPA Special Olympics.JPG"], "bullets": ["Co-gestioné un proyecto regional de USD 1.5 millones sobre participación juvenil y discurso de odio junto con el PNUD, la UNESCO y ONU Mujeres en 5 países balcánicos, logrando 100% de cumplimiento ante los donantes. Diseñé e implementé más de 28 actividades dentro de los portafolios de juventud y construcción de paz, creando marcos de monitoreo, teorías del cambio, alianzas estratégicas e informes financieros y narrativos.", "Conseguí más de EUR 247,000 en financiación del Gobierno de Italia para intercambios juveniles que abordaban la transferencia intergeneracional de trauma en comunidades divididas. Desarrollé y publiqué el Manual Abreviado de Construcción de Paz entre Pares Juveniles, institucionalizado en 3 universidades, y capacité a más de 550 jóvenes mediante un programa regional de Formación de Formadores en un plazo de 1 año. Facilité la cooperación interinstitucional que estableció el primer Órgano Asesor de Juventud del Equipo País de la ONU en Bosnia y Herzegovina.", "Lideré el trabajo de UNFPA en inclusión social, coordinando iniciativas de inclusión que alcanzaron a 760 beneficiarios (población romaní, jóvenes con discapacidad, LGBTIQ+), una de las cuales fue reconocida como buena práctica por UNFPA y Special Olympics.", "Apoyé el portafolio de género y violencia sexual relacionada con el conflicto, el monitoreo y evaluación programática bajo el enfoque de gestión basada en resultados, y apoyé más de 15 campañas de incidencia en redes sociales junto con instituciones, sociedad civil y sector privado."]}, {"id": "giz-timor", "year": "07/2019 – 01/2020", "title": "Apoyo Internacional", "org": "Proyecto de Alianza para la Agroforestería Sostenible, GIZ | Dili, Timor-Leste", "bullets": ["Lideré la planificación participativa del uso del suelo en múltiples municipios; realicé el monitoreo para las evaluaciones intermedia y final del proyecto.", "Realicé investigación de métodos mixtos sobre diversificación económica y prácticas agroforestales; produje notas de política que informaron las estrategias de los donantes, y coordiné eventos nacionales con asistencia del cuerpo diplomático.", "Implementé la estrategia de género del proyecto, supervisando consultorías y garantizando la inclusión de mujeres y grupos marginados."], "photos": ["HFR Timor-Leste.JPG", "HFR Timor-Leste 1.JPG", "HFR Timor-Leste 2.JPG", "HFR Timor-Leste 3.JPG", "HFR Timor-Leste 4.JPG"]}, {"id": "masters", "year": "2018–2020", "title": "Maestría en Desarrollo Internacional y Gestión", "org": "Universidad de Lund, Suecia", "desc": "Me trasladé a Suecia como representante estudiantil electo y becario, investigando el desarrollo impulsado por la comunidad a través de un estudio de caso sobre Timor-Leste."}, {"id": "propaz", "year": "01/2017 – 08/2018", "title": "Asesor Líder en Justicia Transicional y Personas Desaparecidas", "org": "Programa de Construcción de Paz – ProPaz, GIZ | Bogotá, Colombia", "bullets": ["Forjé alianzas estratégicas con la Fiscalía General de la Nación, la Jurisdicción Especial para la Paz y la Unidad de Búsqueda de Personas Desaparecidas para avanzar los procesos de justicia bajo el Acuerdo de Paz de 2016, con el acompañamiento y financiación de la Unión Europea (UE).", "Gestioné donaciones y subvenciones con organizaciones de la sociedad civil (p. ej., la Comisión Colombiana de Juristas, la ONG Humanas), mejorando la participación de las víctimas y el acceso de las mujeres a la justicia. Realicé actividades de monitoreo y evaluación considerando las dinámicas migratorias y fronterizas.", "Produje informes integrales sobre violaciones de derechos humanos para instituciones de justicia transicional, alimentando la incidencia y las reformas de política; sistematicé conocimiento y gestioné el aprendizaje y las comunicaciones.", "Dirigí la planificación operativa y financiera del componente de justicia transicional; supervisé a implementadores y consultores, garantizando la rendición de cuentas y la evaluación de proyectos y consultorías."]}, {"id": "arn", "year": "02/2016 – 12/2016", "title": "Jefe de la Oficina de Aguachica", "org": "Agencia Colombiana para la Reincorporación y la Normalización | Aguachica, Cesar, Colombia", "bullets": ["Dirigí un equipo de 15 personas en 14 municipios, implementando la política nacional de reintegración para excombatientes, y realizando su análisis, monitoreo y evaluación a nivel regional.", "Conseguí COP $2.300 millones (~USD 600 mil) en financiación municipal para la sostenibilidad de las iniciativas de reintegración. Sistematicé 15 buenas prácticas en productos de conocimiento para su adopción en la política nacional.", "Diseñé e implementé un innovador piloto de reintegración política (una plataforma de diálogo entre excombatientes, víctimas y líderes sociales que fomentó la reconciliación), que obtuvo financiación del Ministerio del Interior.", "Generé alianzas con el sector privado para la generación de ingresos, creé estrategias de comunicación y representé a la institución ante los medios."], "photos": ["ACR Team.jpg", "HFR ACR 1.jpg", "HFR ACR 3.jpg", "HFR ACR Radio interview.jpg", "HFR ACR Radio interview (2).jpg"]}, {"id": "oas", "year": "05/2015 – 12/2015", "title": "Practicante de Apoyo Nacional", "org": "Organización de los Estados Americanos – Misión de Apoyo al Proceso de Paz (MAPP-OEA) | Valledupar, Colombia", "bullets": ["Monitoreé y analicé las dinámicas del conflicto en 3 departamentos (Guajira, Magdalena y Cesar), produciendo informes y recomendaciones de política para altos funcionarios del gobierno y las fuerzas militares sobre seguridad, desplazamiento, Desarme, Desmovilización y Reintegración (DDR), y construcción de paz.", "Recopilé y trianguléé datos cualitativos y cuantitativos sobre el conflicto para orientar las estrategias nacionales de construcción de paz. Apoyé el monitoreo de la asistencia humanitaria, la respuesta a riesgos de desastre, la migración y las dinámicas fronterizas con Venezuela."], "photos": ["HFR Mapp OEA.jpg", "HFR Mapp OEA 1.jpg", "HFR Mapp OEA 2.jpg", "HFR Mapp OEA 3.jpg"]}, {"id": "profis-ombudsman", "year": "04/2014 – 04/2015", "title": "Asesor de la Defensoría del Pueblo", "org": "Proyecto de Apoyo a la Justicia Transicional – ProFis, GIZ | Barranquilla, Colombia", "bullets": ["Diseñé e impartí formación en litigio estratégico para representantes judiciales sobre derechos humanos, violencia basada en género (VBG) y diálogo intercultural con pueblos étnicos e indígenas, para fortalecer las reparaciones en casos emblemáticos de justicia transicional.", "Establecí un mecanismo de coordinación interinstitucional para la Ley de Justicia y Paz, elegido por más de 6 instituciones nacionales y actores internacionales como secretaría técnica. Compilé lecciones aprendidas, realicé actividades de aprendizaje y sistematicé conocimiento sobre reparaciones en un capítulo de un libro que publiqué."], "photos": ["ProFis Quilla.jpg", "ProFis Quilla 1.jpg", "ProFis Quilla 2.jpg", "ProFis Quilla 3.jpg", "ProFis Quilla 4.jpg"]}, {"id": "hr-ihl", "year": "2014–2015", "title": "Especialización en Derechos Humanos y DIH", "org": "Universidad del Magdalena, Colombia", "desc": "Profundicé mi formación técnica en derechos humanos y DIH — la columna vertebral jurídica de todo lo que haría después en justicia transicional."}, {"id": "legal-assistant", "year": "09/2012 – 06/2013", "title": "Asistente de Área Legal", "org": "Proyecto de Apoyo a la Justicia Transicional – ProFis, GIZ | Bogotá, Colombia", "bullets": ["Monitoreé los procesos y audiencias dentro del proceso especial de transición de la Ley de Justicia y Paz, así como el seguimiento especial del caso de José Ever Veloza García.", "Supervisé procesos legislativos relacionados con justicia transicional, derechos humanos, responsabilidad corporativa y debida diligencia. Contribuí a la publicación de materiales educativos y de incidencia."]}, {"id": "mgmt-assistant", "year": "02/2013 – 02/2014", "title": "Asistente de Gerencia", "org": "Renta Espacio | Bogotá, Colombia", "bullets": ["Dirigí y ejecuté la estrategia de comunicaciones, publicidad y marketing de la empresa. Desarrollé e implementé campañas para aumentar la visibilidad de la marca en diversos canales online y offline, y lideré la renovación de la imagen corporativa de la empresa.", "Lideré iniciativas de responsabilidad social empresarial (RSE), garantizando que las actividades estuvieran alineadas con los valores de la empresa y generaran un impacto positivo."]}, {"id": "specialist-policy", "year": "2012–2013", "title": "Especialización en Estado, Política Pública y Desarrollo", "org": "Universidad de los Andes, Colombia", "desc": "Volví a las aulas para un diplomado de especialización que afinó mi comprensión de cómo los Estados diseñan y ejecutan realmente sus políticas."}, {"id": "researcher-cider", "year": "02/2012 – 05/2012", "title": "Investigador", "org": "Centro Interdisciplinario de Estudios sobre Desarrollo, Universidad de los Andes | Bogotá, Colombia", "desc": "Brindé apoyo en métodos de investigación cualitativa para la preparación de un protocolo de salidas de campo flexibles para estudiantes, investigadores y docentes."}, {"id": "intern", "year": "2011", "title": "Pasante, Ministerio de Defensa", "org": "Bogotá, Colombia", "desc": "Mis primeros pasos en el sector público: monitoreo de relaciones bilaterales, preparación de visitas de alto nivel y traducción de acuerdos de cooperación entre Colombia y Estados Unidos."}, {"id": "undergrad", "year": "2007–2012", "title": "Pregrado en Ciencia Política", "org": "Universidad de los Andes, Bogotá, Colombia", "desc": "Estudié Ciencia Política con diplomado en Política Pública en la Universidad de los Andes — los años que orientaron mi brújula hacia el desarrollo y los derechos humanos."}, {"id": "hs-ca", "year": "2007", "title": "Graduación de bachillerato", "org": "California, Estados Unidos", "desc": "Un segundo diploma, esta vez en California — mi primer verdadero contacto con vivir en el extranjero."}, {"id": "hs-bog", "year": "2006", "title": "Graduación de bachillerato", "org": "Bogotá, Colombia", "desc": "Terminé el colegio en Bogotá, la ciudad donde todo empezó."}]}, "training": {"label": "Formación y Voluntariado", "title": "Cursos, Formación y Voluntariado", "items": [{"title": "Liderazgo Emergente e Impulso de Carrera", "org": "Colegio del Personal del Sistema de Naciones Unidas, Turín, Italia", "date": "05/2023"}, {"title": "Sensibilidad al Conflicto", "org": "Adapt Peacebuilding, Mallorca, España", "date": "11/2022"}, {"title": "Academia Internacional de Verano de Kosovo", "org": "Centro de Kosovo para la Diplomacia, Pristina, Kosovo", "date": "07/2022"}, {"title": "Impulsando la Agenda de Juventud, Paz y Seguridad", "org": "Colegio del Personal del Sistema de Naciones Unidas, En línea", "date": "12/2021"}, {"title": "Curso Avanzado de Microsoft Excel", "org": "Asociación Rosarista, Bogotá, Colombia", "date": "10/2013"}, {"title": "Voluntariado en la Subregión del Sur del Cesar", "org": "Programa de Paz y Desarrollo del Magdalena Medio", "date": "07–10/2016"}], "skillsTitle": "Habilidades y Herramientas", "skillsItems": ["NVivo", "SPSS", "Canva", "Prezi", "Monday.com", "Asana", "CapCut", "Miro", "Mentimeter", "Padlet", "Appsheet", "Chat GPT", "Claude", "Deepseek", "Gemini", "Copilot", "Zapier", "Airtable", "NotebookLM", "Lumo", "Slack" , sin proceso de compilación"], "prompts": ["Constrúyeme un sitio de portafolio completo como un solo archivo HTML autocontenido. Pregúntame por cualquier dato que te falte antes de construir.", "Convierte [sitio de referencia] en una skill de diseño reutilizable — extrae las fuentes, colores y patrones de diseño para poder aplicarlos de forma consistente en futuros builds.", "Dale estilo a mi portafolio con mi skill de diseño, y lee el archivo de la skill antes de escribir cualquier CSS.", "Construye [nombre del proyecto] como una tarjeta real: aquí está la historia de cómo lo construí y lo que debería mostrar la documentación.", "Deja todo lo demás como 'Próximamente' hasta que realmente lo haya terminado — no inventes contenido para proyectos que aún no he construido."]}, {"title": "Voice Guide Skill", "desc": "Una skill que captura mi voz de escritura para que los borradores suenen como yo."}, {"title": "Email Manager Scheduled Task", "desc": "Una tarea automatizada que clasifica y resume mi bandeja de entrada de forma programada."}, {"title": "Custom Workflow", "desc": "Un flujo de trabajo personalizado de varios pasos, creado para una tarea recurrente."}, {"title": "Spreadsheet Analysis", "desc": "Análisis y limpieza asistidos por IA de una hoja de cálculo real y desordenada."}, {"title": "Data Analysis Presentation", "desc": "Una presentación que convierte datos en bruto en una historia clara, lista para la toma de decisiones."}, {"title": "File Organization Process", "desc": "Un proceso repetible para ordenar y organizar archivos desordenados."}, {"title": "AI Context File", "desc": "Un archivo de contexto estructurado que ayuda a las herramientas de IA a entender mejor mi trabajo."}, {"title": "Skills Library", "desc": "Una colección creciente de skills reutilizables construidas a lo largo del programa."}]}, "pubs": {"label": "Publicaciones y Reconocimientos", "title": "En papel y reconocido", "items": [{"title": "Desarrollo impulsado por la comunidad en Ti sortie.", "Ce travail m'a mené en Colombie, en Bosnie-Herzégovine et au Timor oriental, et j'ai aussi vécu à l'étranger pour mes études, aux États-Unis et en Suède. La SIDA a financé mon poste diplomatique auprès du Fonds des Nations Unies pour la Population - UNFPA en Bosnie, et au fil des ans j'ai surtout travaillé aux côtés d'organisations comme l'Agence allemande de coopération internationale - GIZ, le Programme des Nations Unies pour le Développement - PNUD, et l'Organisation des États Américains - OEA. Je suis titulaire d'un master de l'Université de Lund, de deux diplômes de troisième cycle supplémentaires, et d'une licence en sciences politiques.", "Aujourd'hui, plutôt que de regarder vers un passé violent et ses conséquences sur le présent, j'ai choisi de me tourner vers l'avenir en m'engageant dans la transformation numérique. Porté par un vif intérêt pour l'intelligence artificielle, j'embrasse cette ère comme un changement révolutionnaire pour continuer le combat pour les droits humains, l'égalité et la justice sociale à l'échelle mondiale.", "En dehors du travail, je suis jongleur professionnel avec un faible pour le cirque et les arts de la scène. Voyager me fait sentir libre, écouter et découvrir de la nouvelle musique influence mon humeur, cuisiner m'aère l'esprit, danser me procure toujours de la joie, les sports extrêmes défient mes peurs, faire de l'exercice me fait sentir vivant, et l'artisanat nourrit ma curiosité.", "J'essaie d'être sensible aux questions de genre, inclusif et respectueux de l'environnement — je suis toujours partant pour aller dans la nature, découvrir de nouveaux horizons, rencontrer de nouvelles personnes, ou être surpris par une conversation qui part dans une direction inattendue.", "N'hésitez pas à me contacter ! Parlons développement international, astuces d'intelligence artificielle, ou échangeons simplement sur les voyages, la musique, ou les meilleurs endroits où sortir, où que vous soyez."]}, "skills": {"label": "Compétences", "title": "Compétences et Outils", "licenseLabel": "Permis de conduire", "interests": {"title": "Centres d'intérêt et Langues", "text": "Je suis jongleur professionnel avec un véritable amour pour les arts de la scène — la musique, la danse, rester actif et les conversations qui partent dans des directions intéressantes sont ce qui me ressource entre deux projets.", "mediaHint": "Quelques photos du chemin parcouru", "langTitle": "Langues", "native": "Langue maternelle", "learning": "En cours d'apprentissage"}, "categories": [{"name": "Données et Suivi-Évaluation", "tools": [{"name": "NVivo", "mono": "Nv", "color": "#A6303A"}, {"name": "SPSS", "mono": "SP", "color": "#2E4057"}, {"name": "AppSheet", "mono": "Ap", "color": "#34A853"}, {"name": "Results-Based Management", "mono": "RBM", "color": "#4A6FA5"}, {"name": "Logical Framework", "mono": "LF", "color": "#C98B2E"}, {"name": "Surveys", "mono": "Sv", "color": "#2F7A6B"}]}, {"name": "Design et Communication", "tools": [{"name": "Canva", "mono": "Cv", "color": "#6C5CE7"}, {"name": "Prezi", "mono": "Pz", "color": "#1A73C1"}, {"name": "CapCut", "mono": "Cc", "color": "#0FC2C0"}]}, {"name": "Gestion de Programmes et de Projets", "tools": [{"name": "Monday.com", "mono": "Mo", "color": "#FF3D57"}, {"name": "Asana", "mono": "As", "color": "#F06A6A"}]}, {"name": "Intelligence Artificielle", "tools": [{"name": "ChatGPT", "mono": "Gp", "color": "#10A37F"}, {"name": "Claude", "mono": "Cl", "color": "#D97757"}, {"name": "DeepSeek", "mono": "Ds", "color": "#3B5BFF"}, {"name": "Gemini", "mono": "Ge", "color": "#4285F4"}, {"name": "Copilot", "mono": "Co", "color": "#0078D4"}, {"name": "Zapier", "mono": "Za", "color": "#FF4A00"}, {"name": "Airtable", "mono": "At", "color": "#FCB400"}, {"name": "NotebookLM", "mono": "Nl", "color": "#8E44AD"}, {"name": "Lumo", "mono": "Lu", "color": "#6D4AFF"}]}, {"name": "Productivité au Quotidien", "tools": [{"name": "Google Suite", "mono": "Gs", "color": "#4285F4"}, {"name": "Microsoft Office", "mono": "Of", "color": "#D83B01"}, {"name": "Microsoft Teams", "mono": "Te", "color": "#464EB8"}, {"name": "Slack", "mono": "Sl", "color": "#611F69"}, {"name": "Outlook", "mono": "Ol", "color": "#0072C6"}, {"name": "Zoom", "mono": "Zm", "color": "#2D8CFF"}, {"name": "Adobe", "mono": "Ad", "color": "#DA1F26"}, {"name": "GitHub", "mono": "Gh", "color": "#171515"}]}]}, "background": {"label": "Parcours", "title": "Une vie, brièvement retracée", "hint": "Survolez ou touchez une étape pour zoomer — éloignez le curseur pour fermer", "items": [{"id": "dt", "year": "02/2026 – Présent", "title": "Consultant en Transformation Numérique", "org": "Renta Espacio | Bogotá, Colombie", "bullets": ["Je dirige l'optimisation des solutions no-code, l'automatisation des flux de travail opérationnels et commerciaux, ainsi que la gestion des plateformes internes, des outils CRM et des applications de reporting.", "Je mets en œuvre des solutions pratiques d'intelligence artificielle (IA), notamment des assistants basés sur l'IA, l'ingénierie de messagerie instantanée pour les ventes et le service client, des systèmes de réponse automatisée, la notation des prospects, des rapports exécutifs, l'amélioration des bots, la génération de contenu par IA et le contrôle qualité.", "J'intègre de multiples écosystèmes numériques, notamment Google Workspace, AppSheet, DataCRM, l'API WhatsApp Business et des bases de données internes, tout en développant des protocoles utilisateurs, du matériel de formation et des sessions de renforcement des capacités pour renforcer l'adoption numérique et l'efficacité opérationnelle dans toutes les équipes."]}, {"id": "undp", "year": "02/2025 – 06/2025", "title": "Consultant expert en justice transitionnelle et conception de projets", "org": "Programme des Nations Unies pour le Développement (PNUD) | Bogotá, Colombie", "photos": ["PNUD Grupo Tumaco.JPEG", "PNUD Tumaco Facilitacion.JPEG", "HFR PNUD Facilitacion 1.JPEG", "HFR PNUD.JPG", "HFR PNUD 1.JPG"], "bullets": ["J'ai conçu et formulé un projet de justice restaurative à Tumaco pour les femmes et les personnes LGBTIQ+ survivantes de violences sexuelles et basées sur le genre, en développant une théorie du changement complète, un cadre logique et un système intégral de suivi-évaluation.", "J'ai dirigé l'évaluation de 4 projets de justice restaurative en Colombie, produisant des recommandations stratégiques pour leur pérennité et leur renforcement institutionnel. J'ai dirigé les opérations de l'équipe de consultants (techniques, administratives et logistiques), garantissant la livraison à temps de tous les produits.", "J'ai facilité un processus de co-création avec 13 organisations de la société civile et autorités ethniques, en systématisant les résultats sous forme de leçons apprises exploitables, de bonnes pratiques et de rapports aux bailleurs de fonds."]}, {"id": "sabbatical", "year": "12/2023 – 01/2025", "title": "Année sabbatique", "org": "Asie du Sud-Est, Chine, Europe, Colombie et Asie centrale", "photos": ["HFR Angkor Wat.JPEG", "HFR Chinese Wall.jpg", "HFR Samarkand.JPEG", "HFR Tajik Mountains.JPEG", "HFR Durmitor Hike.JPEG"], "desc": "J'ai pris une année pour voyager lentement — Asie du Sud-Est, Chine, Europe, Colombie et Asie centrale — en laissant la curiosité, et non un titre de poste, dicter l'itinéraire."}, {"id": "unfpa", "year": "06/2021 – 12/2023", "title": "Analyste de programme P2 (JPO financé par la SIDA)", "org": "Fonds des Nations Unies pour la Population (UNFPA) | Sarajevo, Bosnie-Herzégovine", "photos": ["Bodyright.JPEG", "HFR Bodyright Panel.JPEG", "HFR UNFPA Western Balkans.JPEG", "UN BiH Team.jpg", "HFR UNFPA Special Olympics.JPG"], "bullets": ["J'ai cogéré un projet régional de 1,5 million USD sur la participation des jeunes et le discours de haine avec le PNUD, l'UNESCO et ONU Femmes dans 5 pays des Balkans, atteignant 100 % de conformité envers les bailleurs de fonds. J'ai conçu et mis en œuvre plus de 28 activités au sein des portefeuilles jeunesse et consolidation de la paix, créant des cadres de suivi, des théories du changement, des partenariats stratégiques et des rapports financiers et narratifs.", "J'ai obtenu plus de 247 000 EUR de financement du gouvernement italien pour des échanges de jeunes traitant de la transmission intergénérationnelle des traumatismes dans les communautés divisées. J'ai développé et publié le Manuel abrégé de consolidation de la paix entre pairs pour les jeunes, institutionnalisé dans 3 universités, et formé plus de 550 jeunes à travers un programme régional de formation de formateurs en un an. J'ai facilité la coopération interagences établissant le premier Organe consultatif jeunesse de l'équipe de pays des Nations Unies en Bosnie-Herzégovine.", "J'ai dirigé le travail de l'UNFPA sur l'inclusion sociale, en coordonnant des initiatives d'inclusion touchant 760 bénéficiaires (Roms, jeunes en situation de handicap, personnes LGBTIQ+), l'une d'elles ayant été reconnue comme bonne pratique par l'UNFPA et Special Olympics.", "J'ai soutenu le portefeuille genre et violences sexuelles liées aux conflits, le suivi-évaluation programmatique selon l'approche de gestion axée sur les résultats, et soutenu plus de 15 campagnes de sensibilisation sur les réseaux sociaux aux côtés d'institutions, de la société civile et du secteur privé."]}, {"id": "giz-timor", "year": "07/2019 – 01/2020", "title": "Appui International", "org": "Projet de partenariat pour l'agroforesterie durable, GIZ | Dili, Timor-Leste", "bullets": ["J'ai dirigé la planification participative de l'utilisation des terres dans plusieurs municipalités ; j'ai assuré le suivi pour les évaluations à mi-parcours et finale du projet.", "J'ai mené une recherche à méthodes mixtes sur la diversification économique et les pratiques agroforestières ; j'ai produit des notes de politique éclairant les stratégies des bailleurs de fonds, et coordonné des événements nationaux auxquels a assisté le corps diplomatique.", "J'ai mis function detectLang(){
  const stored = localStorage.getItem('site_lang');
  if(stored) return stored;
  const supported = ['en','es','fr'];
  const browserLangs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  for(const bl of browserLangs){
    const primary = (bl || '').toLowerCase().split('-')[0];
    if(supported.includes(primary)) return primary;
  }
  return 'en';
}
let currentLang = detectLang();

function renderNav(t){
  const ul = document.getElementById('navLinks');
  ul.innerHTML = '';
  const items = [
    ['#about', t.nav.about],
    ['#background', t.nav.background],
    ['#projects', t.nav.projects],
    ['#pubs', t.nav.pubs],
    ['#training', t.nav.training],
    ['#contact', t.nav.contact]
  ];
  items.forEach(([href,label])=>{
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = href; a.textContent = label;
    a.addEventListener('click', ()=>{ document.getElementById('mainNav').classList.remove('open'); });
    li.appendChild(a);
    ul.appendChild(li);
  });
}

let currentTimelineItems = [];
let tmOpenTimeout = null;

function renderBackground(t){
  document.getElementById('bgLabel').textContent = t.background.label;
  document.getElementById('bgTitle').textContent = t.background.title;
  document.getElementById('bgHint').textContent = t.background.hint;
  currentTimelineItems = t.background.items;
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  t.background.items.forEach((item, idx)=>{
    const wrap = document.createElement('div');
    wrap.className = 't-item';
    const dot = document.createElement('div');
    dot.className = 't-dot';
    const node = document.createElement('div');
    node.className = 't-node';
    node.innerHTML = `<div class="t-year">${item.year}</div><div class="t-title">${item.title}</div><div class="t-org">${item.org}</div>`;
    const scheduleOpen = ()=>{
      clearTimeout(tmCloseTimeout);
      tmOpenTimeout = setTimeout(()=> openTimelineModal(idx), 60);
    };
    const scheduleClose = ()=>{
      clearTimeout(tmOpenTimeout);
      tmCloseTimeout = setTimeout(closeTimelineModal, 320);
    };
    dot.addEventListener('mouseenter', scheduleOpen);
    node.addEventListener('mouseenter', scheduleOpen);
    dot.addEventListener('mouseleave', scheduleClose);
    node.addEventListener('mouseleave', scheduleClose);
    dot.addEventListener('click', ()=> openTimelineModal(idx));
    node.addEventListener('click', ()=> openTimelineModal(idx));
    wrap.appendChild(dot);
    wrap.appendChild(node);
    tl.appendChild(wrap);
  });
}

function openTimelineModal(idx){
  clearTimeout(tmCloseTimeout);
  const item = currentTimelineItems[idx];
  const t = CONTENT[currentLang];
  document.getElementById('tmYear').textContent = item.year;
  document.getElementById('tmTitle').textContent = item.title;
  document.getElementById('tmOrg').textContent = item.org;
  const descWrap = document.getElementById('tmDesc');
  if(item.bullets){
    descWrap.innerHTML = '<ul>' + item.bullets.map(b=>`<li>${b}</li>`).join('') + '</ul>';
  } else {
    descWrap.innerHTML = `<p>${item.desc}</p>`;
  }
  const media = document.getElementById('tmMedia');
  media.innerHTML = '';
  const photos = item.photos || [];
  photos.forEach(name=>{
    const slot = document.createElement('div');
    slot.className = 'media-slot';
    const img = document.createElement('img');
    img.src = photoPath(name);
    img.alt = '';
    slot.appendChild(img);
    img.addEventListener('mouseenter', ()=> showPhotoZoom(img.src));
    img.addEventListener('mouseleave', hidePhotoZoom);
    media.appendChild(slot);
  });
  document.getElementById('tmOverlay').classList.add('open');
}
function closeTimelineModal(){
  document.getElementById('tmOverlay').classList.remove('open');
  hidePhotoZoom();
}

function getPhotoZoomEl(){
  let el = document.getElementById('photoZoomPreview');
  if(!el){
    el = document.createElement('div');
    el.id = 'photoZoomPreview';
    el.className = 'photo-zoom-preview';
    el.innerHTML = '<img alt="">';
    document.body.appendChild(el);
  }
  return el;
}
function showPhotoZoom(src){
  const el = getPhotoZoomEl();
  el.querySelector('img').src = src;
  el.classList.add('show');
}
function hidePhotoZoom(){
  const el = document.getElementById('photoZoomPreview');
  if(el) el.classList.remove('show');
}

  track.innerHTML = '';
  const n = items.length;
  if(n === 0) return { prev(){}, next(){}, stop(){} };
  const cloneCount = Math.min(perView, n);
  for(let i = n - cloneCount; i < n; i++){ track.appendChild(renderItem(items[i])); }
  items.forEach(item => track.appendChild(renderItem(item)));
  for(let i = 0; i < cloneCount; i++){ track.appendChild(renderItem(items[i])); }

  let index = cloneCount;
  track.style.transition = 'none';
  track.style.transform = `translateX(-${index * (100/perView)}%)`;

  function goTo(i, animate){
    track.style.transition = animate ? 'transform .55s ease' : 'none';
    track.style.transform = `translateX(-${i * (100/perView)}%)`;
  }

  function step(dir){
    if(n <= perView) return;
    index += dir;
    goTo(index, true);
    setTimeout(()=>{
      if(index >= cloneCount + n){ index -= n; goTo(index, false); }
      else if(index <= 0){ index += n; goTo(index, false); }
    }, 560);
  }

  let autoId = null;
  function startAuto(){
    if(autoId) clearInterval(autoId);
    autoId = (n > perView) ? setInterval(()=> step(autoDir), autoMs) : null;
  }
  startAuto();

  return {
    prev(){ step(-1); startAuto(); },
    next(){ step(1); startAuto(); },
    stop(){ if(autoId) clearInterval(autoId); autoId = null; }
  };
}

      <div class="step-content"><p>${s}</p></div>

}

        <div class="swatch-role">${d.roles[i]}</div>
        <div class="swatch-hex">${c.hex}</div>

    <div class="doc-section">
      <h4>${d.sectionColor}</h4>
      <div class="swatch-grid">${swatches}</div>
    </div>
    <div class="doc-section">
      <h4>${d.sectionType}</h4>
      <div class="type-sample">
        <div class="ts-label">${d.headline.label}</div>
        <div class="ts-sample-headline">${d.headline.sample}</div>
        <div class="ts-spec">${d.headline.spec}</div>

        <div class="ts-sample-label">${d.labelSample.sample}</div>

let awardsInterval = null;
function renderAwards(t){
  document.getElementById('awardsSubTitle').textContent = t.awards.title;
  const track = document.getElementById('awardsTrack');
  track.innerHTML = '';
  const perView = 4;
  const items = t.awards.items;
  function makeCard(item){
    const card = document.createElement('div');
    card.className = 'award-card';
    card.innerHTML = `<h4>${item.title}</h4><span class="a-sub">${item.subtitle}</span><p>${item.desc}</p>`;
    return card;
  }
  items.forEach(item => track.appendChild(makeCard(item)));
  const cloneCount = Math.min(perView, items.length);
  for(let i=0;i<cloneCount;i++){ track.appendChild(makeCard(items[i])); }

  clearInterval(awardsInterval);
  track.style.transition = 'none';
  track.style.transform = 'translateX(0%)';
  let index = 0;
  const total = items.length;
  if(total > perView){
    awardsInterval = setInterval(()=>{
      index++;
      track.style.transition = 'transform .6s ease';
      track.style.transform = `translateX(-${index * (100/perView)}%)`;
      if(index >= total){
        setTimeout(()=>{
          track.style.transition = 'none';
          index = 0;
          track.style.transform = 'translateX(0%)';
        }, 620);
      }
    }, 5000);
  }
}

/* Project modal */
const modalOverlay = document.getElementById('modalOverlay');
const modalEl = modalOverlay.querySelector('.modal');
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-kind]');
  if(!btn) return;
  const t = CONTENT[currentLang];
  const kind = btn.getAttribute('data-kind');
  const id = btn.getAttribute('data-id');
  const item = id ? findProjectById(id) : null;

  document.getElementById('modalKicker').textContent = btn.getAttribute('data-label');
  document.getElementById('modalTitle').textContent = btn.getAttribute('data-title');

  let richHtml = null;
  if(item && kind === 'howBuilt' && item.howBuilt){
    richHtml = renderGhostSteps(item.howBuilt);
  } else if(item && kind === 'docs' && item.docsType === 'skill-doc'){
    richHtml = renderSkillDoc(t);
  } else if(item && kind === 'docs' && item.docsType === 'techniques-prompts'){
    richHtml = renderTechniquesPrompts(t, item);
  }

  const currentBody = document.getElementById('modalBody');
  if(richHtml){
    modalEl.classList.add('modal-lg');
    const fresh = document.createElement('div');
    fresh.id = 'modalBody';
    fresh.innerHTML = richHtml;
    currentBody.replaceWith(fresh);
  } else {
    modalEl.classList.remove('modal-lg');
    const fresh = document.createElement('p');
    fresh.id = 'modalBody';
    fresh.textContent = t.modal.comingSoon;
    currentBody.replaceWith(fresh);
  }
  modalOverlay.classList.add('open');
});
document.getElementById('modalClose').addEventListener('click', ()=> modalOverlay.classList.remove('open'));
modalOverlay.addEventListener('click', (e)=>{ if(e.target === modalOverlay) modalOverlay.classList.remove('open'); });

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    modalOverlay.classList.remove('open');
    closeTimelineModal();
  }
});

/* Pac-Man scroll progress */
const DOT_COUNT = 40;
const pacmanTrack = document.getElementById('pacmanTrack');
const pacmanIcon = document.getElementById('pacmanIcon');
const dotEls = [];
for(let i=0;i<DOT_COUNT;i++){
  const d = document.createElement('div');
  d.className = 'pac-dot';
  pacmanTrack.insertBefore(d, pacmanIcon);
  dotEls.push(d);
}
function updatePacman(){
  const scrollTop = window.scrollY || document.documentElement.scrollTop;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const pct = max > 0 ? Math.min(100, Math.max(0, (scrollTop / max) * 100)) : 0;
  const trackWidth = pacmanTrack.clientWidth - 64; /* account for side padding */
  const leftPx = 32 + (trackWidth * pct / 100);
  pacmanIcon.style.left = leftPx + 'px';
  dotEls.forEach((dot, i)=>{
    const dotPct = (i/(DOT_COUNT-1))*100;
    dot.classList.toggle('eaten', dotPct < pct);
  });
}
window.addEventListener('scroll', updatePacman, {passive:true});
window.addEventListener('resize', updatePacman);

render();
updatePacman();
